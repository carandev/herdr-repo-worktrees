id = "repo-worktrees"
name = "Repo-relative worktrees"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Create git worktrees at a repository-relative, per-project configurable path (default .claude/worktrees/<branch-slug>)."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "new-worktree"
title = "New worktree (repo-relative)"
contexts = ["workspace"]
command = ["node", "bin/open-prompt.mjs"]

[[panes]]
id = "prompt"
title = "New worktree"
placement = "popup"
width = "60%"
height = "30%"
command = ["node", "bin/prompt.mjs"]
