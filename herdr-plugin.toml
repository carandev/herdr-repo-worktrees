id = "repo-worktrees"
name = "Repo-relative worktrees"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Create git worktrees at a repository-relative, per-project configurable path (default .claude/worktrees/<branch-slug>), and open new workspaces in a directory you choose."
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "new-worktree"
title = "New worktree (repo-relative)"
contexts = ["workspace"]
command = ["node", "bin/open-prompt.mjs"]

[[panes]]
id = "prompt"
title = "New worktree"
placement = "popup"
width = "70%"
height = "50%"
command = ["node", "bin/prompt.mjs"]

[[actions]]
id = "new-workspace"
title = "New workspace (choose directory)"
contexts = ["workspace"]
command = ["node", "bin/open-workspace-prompt.mjs"]

[[panes]]
id = "workspace-prompt"
title = "New workspace"
placement = "popup"
width = "70%"
height = "30%"
command = ["node", "bin/workspace-prompt.mjs"]

[[actions]]
id = "configure"
title = "Configure repo worktrees"
contexts = ["workspace"]
command = ["node", "bin/open-config.mjs"]

[[panes]]
id = "config"
title = "Repo worktrees config"
placement = "popup"
width = "80%"
height = "70%"
command = ["node", "bin/config.mjs"]
